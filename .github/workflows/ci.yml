name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Opt every JS-based GitHub Action in this workflow into Node.js 24
  # ahead of GitHub's June 2026 forced cutover. Silences the Node 20
  # deprecation warnings and surfaces any incompatibilities now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # NostrNet.Marmot.Mls.Native wraps OpenMLS via an in-tree Rust crate
      # (nostrnet-marmot-native/). Each matrix runner needs the Rust
      # toolchain available so `cargo build` runs as part of the .NET build.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('nostrnet-marmot-native/Cargo.lock') }}

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: nostrnet-marmot-native/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('nostrnet-marmot-native/**/*.rs', 'nostrnet-marmot-native/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot-publish:
    name: AOT publish smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-aot-${{ hashFiles('nostrnet-marmot-native/Cargo.lock') }}

      - name: Cache cargo target dir
        uses: actions/cache@v5
        with:
          path: nostrnet-marmot-native/target
          key: cargo-aot-target-${{ hashFiles('nostrnet-marmot-native/**/*.rs', 'nostrnet-marmot-native/Cargo.lock') }}
          restore-keys: |
            cargo-aot-target-

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-aot-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-aot-

      - name: Restore
        run: dotnet restore

      # The sample app references every shippable library transitively, so
      # publishing it with PublishAot=true exercises the trim/AOT analyzers
      # across the whole project. Any reflection or trim-unsafe pattern that
      # slipped past the per-csproj <IsAotCompatible> check shows up here.
      - name: AOT publish sample
        run: >-
          dotnet publish samples/NostrNet.Sample.Console
          --configuration Release
          --runtime linux-x64
          -p:PublishAot=true

      # Runtime smoke test of the AOT-compiled binary. Drives the full
      # 1:1 Marmot flow through OpenMLS via the FFI bridge. Failure at
      # runtime catches issues the analyzers can't predict.
      - name: Run MLS smoke test (AOT binary)
        run: ./samples/NostrNet.Sample.Console/bin/Release/net10.0/linux-x64/publish/NostrNet.Sample.Console marmot-mls-smoke
